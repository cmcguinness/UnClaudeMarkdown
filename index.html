<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un-Claude Markdown</title>
<style>
  :root {
    --bg: #f7f7f5;
    --pane: #ffffff;
    --border: #e3e3dd;
    --text: #1f1f1d;
    --muted: #6b6b64;
    --accent: #2b6cb0;
    --accent-hover: #245a94;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1.5rem 3rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  header {
    max-width: 1400px;
    margin: 0 auto 1.5rem;
  }

  h1 {
    margin: 0 0 .25rem;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .tagline {
    margin: 0;
    color: var(--muted);
    font-size: .9rem;
  }

  main {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: stretch;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    min-height: 2rem;
    margin-bottom: .5rem;
  }

  .pane-title {
    font-size: .8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }

  textarea {
    flex: 1;
    width: 100%;
    min-height: 60vh;
    padding: .9rem 1rem;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    tab-size: 4;
  }

  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  textarea[readonly] {
    background: #fbfbfa;
    color: #2f2f2c;
  }

  .controls {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .6rem;
    padding-top: 2.5rem;
  }

  button {
    padding: .5rem .95rem;
    border: 1px solid transparent;
    border-radius: 7px;
    font-family: inherit;
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: .45;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    white-space: nowrap;
  }

  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--pane);
    border-color: var(--border);
    color: var(--muted);
  }

  .btn-secondary:hover:not(:disabled) {
    border-color: #cfcfc7;
    color: var(--text);
  }

  #toast {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translate(-50%, .5rem);
    padding: .55rem 1.1rem;
    background: #2c2c28;
    color: #fff;
    border-radius: 999px;
    font-size: .85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #toast.error { background: #9b2c2c; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    .controls { flex-direction: row; justify-content: flex-start; padding-top: 0; }
    textarea { min-height: 40vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Un-Claude Markdown</h1>
  <p class="tagline">Paste text copied out of the Claude&nbsp;Code terminal. Get markdown that renders the way it was meant to.</p>
</header>

<main>
  <section class="pane">
    <div class="pane-head"><span class="pane-title">Paste here</span></div>
    <textarea id="input" placeholder="Paste your copied text&hellip;" spellcheck="false" autofocus></textarea>
  </section>

  <div class="controls">
    <button id="clean" class="btn-primary" disabled>Clean &rarr;</button>
    <button id="slackify" class="btn-secondary" disabled>Slackify &rarr;</button>
    <button id="clear" class="btn-secondary">Clear</button>
  </div>

  <section class="pane">
    <div class="pane-head">
      <span class="pane-title" id="output-title">Cleaned</span>
      <button id="copy" class="btn-secondary" disabled>Copy to clipboard</button>
    </div>
    <textarea id="output" readonly spellcheck="false" placeholder="Cleaned markdown appears here&hellip;"></textarea>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Cleanup pipeline. See specification.md for the rules these implement.
   * ------------------------------------------------------------------ */

  var TAB_STOP = 4;

  // Claude Code UI chrome that can ride along with a terminal copy.
  //
  // Tree branches (├ └ ─) are deliberately absent: they are structure, not
  // chrome, and the block reconstruction below rebuilds the ones it is confident
  // about. Stripping the leftovers turned "├── src/" into "── src/", which is
  // worse than leaving it alone.
  var GLYPH_LINE = /^([ \t]*)([⏺●⎿│→•‣◦▪])[ \t]*([\s\S]*)$/;

  // Lines that start a new markdown block and so must not be joined onto the
  // line above: list markers, headings, blockquotes, table rows, thematic breaks.
  var BLOCK_START = /^ *(?:[-*+][ \t]|\d+[.)][ \t]|#{1,6}[ \t]|>|\||(?:-{3,}|\*{3,}|_{3,}) *$)/;

  var FENCE = /^ *(?:```|~~~)/;

  // Box-drawing table parts. All four weights a terminal might draw with are
  // accepted — light, rounded, heavy, double — because they are the same
  // structure and which one appears is a rendering choice, not a semantic one.
  var BOX_H  = '─━═';                 // horizontals
  var BOX_V  = '│┃║';                 // verticals
  var BOX_TL = '┌╭┏╔', BOX_TR = '┐╮┓╗';   // top corners
  var BOX_BL = '└╰┗╚', BOX_BR = '┘╯┛╝';   // bottom corners
  var BOX_TD = '┬┳╦', BOX_TU = '┴┻╩';     // tees pointing down / up
  var BOX_LT = '├┣╠', BOX_RT = '┤┫╣';     // tees pointing right / left
  var BOX_X  = '┼╋╬╪╫';               // crossings

  function boxRe(body) {
    return new RegExp('^ *' + body + ' *$');
  }
  function set(chars) { return '[' + chars + ']'; }

  // A table is recognised only from a complete top border, which is the
  // high-confidence signal — a paste that starts mid-table is left alone rather
  // than guessed at. (It is still protected from damage; see BOX_LINE below.)
  var BOX_TOP    = boxRe(set(BOX_TL) + set(BOX_H + BOX_TD) + '*' + set(BOX_TR));
  var BOX_SEP    = boxRe(set(BOX_LT) + set(BOX_H + BOX_X) + '*' + set(BOX_RT));
  var BOX_BOTTOM = boxRe(set(BOX_BL) + set(BOX_H + BOX_TU) + '*' + set(BOX_BR));
  var BOX_ROW    = boxRe(set(BOX_V) + '.*' + set(BOX_V));

  // Any line that is unambiguously part of a box, whether or not the box as a
  // whole was recognised as a table. A truncated paste, an unusual border, a
  // box this tool won't convert — all of them still had a grid the author drew,
  // and the steps below must not dismantle it. A row must both open and close
  // with a vertical: "│ text" with no closing bar is Claude Code's continuation
  // chrome, not a table row, and stays in the glyph step's hands.
  var BOX_BORDER = boxRe(set(BOX_TL + BOX_TR + BOX_BL + BOX_BR + BOX_LT + BOX_RT +
                             BOX_TD + BOX_TU + BOX_X + BOX_H) +
                         set(BOX_TL + BOX_TR + BOX_BL + BOX_BR + BOX_LT + BOX_RT +
                             BOX_TD + BOX_TU + BOX_X + BOX_H) + '+');
  function isBoxLine(line) {
    return BOX_ROW.test(line) || BOX_BORDER.test(line);
  }

  // Directory trees. The branch marker is distinctive enough to be safe; both
  // the unicode form Claude Code emits and `tree`'s ASCII fallback are matched.
  var TREE_BRANCH = /^[│|`\s]*(?:├──|└──|\|--|`--)\s*\S/;
  var TREE_SPACER = /^[│| \t]+$/;
  // A tree's root line: a bare path or filename, no spaces and no punctuation
  // that would suggest prose. "myproject/" qualifies; "Here's the layout:" does not.
  var TREE_ROOT   = /^[\w.@][\w.@+\-\/]*$/;

  // A single shared fence scan, reused by every step that needs to know which
  // lines sit inside a code block. An unclosed fence stays open through the end
  // of the text, so a paste that starts or ends mid-code-block is left alone.
  function computeFences(lines) {
    var inFence = new Array(lines.length);
    var open = false;
    for (var i = 0; i < lines.length; i++) {
      if (FENCE.test(lines[i])) {
        inFence[i] = true;      // the fence marker itself passes through untouched
        open = !open;
      } else {
        inFence[i] = open;
      }
    }
    return inFence;
  }

  function indentOf(line) {
    return line.match(/^ */)[0].length;
  }

  function isBlank(line) {
    return line.trim() === '';
  }

  function text(item) {
    return item.text;
  }

  /* Step 0 — normalize characters. */

  function expandLeadingTabs(line) {
    var out = '', col = 0, i = 0;
    while (i < line.length && (line[i] === ' ' || line[i] === '\t')) {
      if (line[i] === '\t') {
        var advance = TAB_STOP - (col % TAB_STOP);
        out += new Array(advance + 1).join(' ');
        col += advance;
      } else {
        out += ' ';
        col += 1;
      }
      i++;
    }
    return out + line.slice(i);
  }

  function normalize(text) {
    return text
      .replace(/\r\n?/g, '\n')                  // CRLF -> LF
      .replace(/\u00a0/g, ' ')                  // non-breaking space -> space
      .replace(/[\u200b-\u200d\u2060\ufeff]/g, '')    // zero-width invisibles
      .split('\n')
      .map(expandLeadingTabs);
  }

  /* Step 1 — remove the common leading indent, preserving relative nesting.
   *
   * "Common" means the *most frequent* indent, not the smallest. A single
   * outlier line indented less than its neighbours is normal in a terminal copy,
   * and using the minimum would leave a stray space on every other line. Lines
   * shallower than the modal indent are simply flushed left. Code-block interiors
   * are excluded from the vote so a long indented listing can't outvote the prose,
   * but they are still dedented by the winning amount, so nesting survives.
   */

  function dedent(lines) {
    var inFence = computeFences(lines);

    function tally(skipFences) {
      var counts = {}, any = false;
      for (var i = 0; i < lines.length; i++) {
        if (isBlank(lines[i]) || (skipFences && inFence[i])) continue;
        var n = indentOf(lines[i]);
        counts[n] = (counts[n] || 0) + 1;
        any = true;
      }
      return any ? counts : null;
    }

    var counts = tally(true) || tally(false);
    if (!counts) return lines;

    // Object keys for integer-like properties iterate in ascending numeric
    // order, and the comparison is strict, so ties go to the smaller indent.
    var best = 0, bestCount = 0;
    Object.keys(counts).forEach(function (key) {
      if (counts[key] > bestCount) { bestCount = counts[key]; best = Number(key); }
    });

    if (best === 0) return lines;
    return lines.map(function (line) {
      return isBlank(line) ? line : line.slice(Math.min(best, indentOf(line)));
    });
  }

  /* Step 2 — strip trailing whitespace. */

  function stripTrailing(lines) {
    return lines.map(function (line) { return line.replace(/[ \t]+$/, ''); });
  }

  /* Step 2.5 — reconstruct box-drawing blocks.
   *
   * Terminal rendering turns a markdown table into a box-drawn one and a file
   * listing into a tree. Both are structure the author meant to convey, and both
   * are destroyed by the glyph step below if left to it, so they are recognised
   * and rebuilt first. Recognition is deliberately strict: a table needs a
   * complete top border, a tree needs two or more branch lines. Anything less
   * confident is left for the ordinary rules.
   *
   * Reconstructed blocks are flagged `raw` and every later step passes them
   * through untouched.
   */

  var BOX_V_SPLIT = new RegExp('[' + BOX_V + ']');

  function splitCells(line) {
    var t = line.trim();
    return t.slice(1, -1).split(BOX_V_SPLIT).map(function (cell) { return cell.trim(); });
  }

  // One logical row may span several physical lines, because the terminal wrapped
  // a long cell. Fragments of the same column rejoin with a single space; the
  // blank fragments that pad the short columns of a tall row are dropped.
  function mergeRow(physical) {
    var cols = physical.reduce(function (n, cells) { return Math.max(n, cells.length); }, 0);
    var out = [];
    for (var c = 0; c < cols; c++) {
      var parts = [];
      physical.forEach(function (cells) {
        if (cells[c]) parts.push(cells[c]);
      });
      out.push(parts.join(' '));
    }
    return out;
  }

  function parseBoxTable(lines, start) {
    var groups = [], current = [], end = -1, i;

    for (i = start + 1; i < lines.length; i++) {
      if (BOX_BOTTOM.test(lines[i])) { end = i; break; }
      if (BOX_SEP.test(lines[i])) {
        if (current.length) groups.push(current);
        current = [];
      } else if (BOX_ROW.test(lines[i])) {
        current.push(splitCells(lines[i]));
      } else {
        break;   // truncated paste — the table ends at the previous line
      }
    }
    if (current.length) groups.push(current);
    if (!groups.length) return null;

    return { groups: groups, end: end === -1 ? i - 1 : end };
  }

  function boxTableToMarkdown(groups) {
    var rows = groups.map(mergeRow);
    var cols = rows.reduce(function (n, row) { return Math.max(n, row.length); }, 0);

    // A single-column box is a boxed note or ASCII art, not a table.
    if (cols < 2) return null;

    rows = rows.map(function (row) {
      var cells = row.slice();
      while (cells.length < cols) cells.push('');
      return cells.map(function (cell) { return cell.replace(/\|/g, '\\|'); });
    });

    // Pad columns so the emitted source lines up, the way a human would write it.
    // The box drawing carries no alignment information, so every column is left.
    var widths = [];
    for (var c = 0; c < cols; c++) {
      var w = 3;
      rows.forEach(function (row) { w = Math.max(w, row[c].length); });
      widths.push(w);
    }

    function fill(ch, n) { return new Array(n + 1).join(ch); }
    function render(cells) {
      return '| ' + cells.map(function (cell, c) {
        return cell + fill(' ', widths[c] - cell.length);
      }).join(' | ') + ' |';
    }

    var out = [render(rows[0])];
    out.push('| ' + widths.map(function (w) { return fill('-', w); }).join(' | ') + ' |');
    for (var i = 1; i < rows.length; i++) out.push(render(rows[i]));
    return out;
  }

  function treeRun(lines, start, inFence) {
    if (!TREE_BRANCH.test(lines[start])) return null;

    var branches = 0, last = start;
    for (var i = start; i < lines.length && !inFence[i]; i++) {
      if (TREE_BRANCH.test(lines[i])) { branches++; last = i; }
      else if (!TREE_SPACER.test(lines[i])) break;   // blank or prose ends the run
    }
    // A lone branch line is more likely stray chrome than a tree.
    return branches >= 2 ? { start: start, end: last } : null;
  }

  function findBlocks(lines, target) {
    var inFence = computeFences(lines);
    var blocks = [];
    var i = 0;

    while (i < lines.length) {
      if (inFence[i]) { i++; continue; }

      if (BOX_TOP.test(lines[i])) {
        var table = parseBoxTable(lines, i);
        if (table) {
          // A complete box that isn't a table — a boxed note, ASCII art — is
          // still deliberate structure. Fence it rather than convert or strip it.
          // Slack has no table syntax at all, so for that target every box stays
          // a box: fenced verbatim, where monospace keeps the columns lined up.
          var md = (target === 'slack' ? null : boxTableToMarkdown(table.groups)) ||
                   ['```'].concat(lines.slice(i, table.end + 1), ['```']);
          blocks.push({ start: i, end: table.end, out: md });
          i = table.end + 1;
          continue;
        }
      }

      var run = treeRun(lines, i, inFence);
      if (run) {
        var from = run.start;
        // A tree's root sits immediately above it with no blank line between.
        var prev = from - 1;
        var free = !blocks.length || blocks[blocks.length - 1].end < prev;
        if (prev >= 0 && free && !inFence[prev] && TREE_ROOT.test(lines[prev])) from = prev;

        // Markdown collapses the tree's line breaks unless it is fenced.
        blocks.push({
          start: from,
          end: run.end,
          out: ['```'].concat(lines.slice(from, run.end + 1), ['```'])
        });
        i = run.end + 1;
        continue;
      }

      i++;
    }
    return blocks;
  }

  function reconstructBlocks(lines, target) {
    var byStart = {};
    findBlocks(lines, target).forEach(function (b) { byStart[b.start] = b; });

    var items = [];
    var i = 0;
    while (i < lines.length) {
      var block = byStart[i];
      if (block) {
        block.out.forEach(function (line) {
          items.push({ text: line, noJoin: false, raw: true });
        });
        i = block.end + 1;
      } else {
        // A branch line too isolated to be a confident tree, or a box line whose
        // box wasn't recognised, is left as it is — but never joined onto its
        // neighbours, which would glue it into a paragraph and lose the line
        // break it clearly wanted. For a box that means losing the whole grid.
        items.push({
          text: lines[i],
          noJoin: TREE_BRANCH.test(lines[i]) || isBoxLine(lines[i]),
          raw: false
        });
        i++;
      }
    }
    return items;
  }

  /* Step 3 — Claude Code UI glyphs.
   *
   * Structural test, not glyph-specific: two or more lines at the same indent
   * starting with the same glyph are a bullet list and become "- ". Anything
   * else is chrome and gets stripped. A blank line or a shallower-indented line
   * breaks a run; unglyphed lines at the same-or-deeper indent are wrapped
   * continuations and do not.
   */

  function handleGlyphs(items) {
    var lines = items.map(text);
    var inFence = computeFences(lines);
    // A table row opens with the same │ this step treats as chrome. Rows are
    // held back from the match entirely: stripping their leading bar, or worse
    // reading a column of them as a bullet list, destroys the grid.
    var match = lines.map(function (line, i) {
      if (inFence[i] || items[i].raw || isBoxLine(line)) return null;
      return GLYPH_LINE.exec(line);
    });

    var action = new Array(lines.length);
    var run = [], runIndent = -1, runGlyph = null;

    function flush() {
      if (run.length) {
        var kind = run.length >= 2 ? 'bullet' : 'strip';
        run.forEach(function (i) { action[i] = kind; });
      }
      run = []; runIndent = -1; runGlyph = null;
    }

    for (var i = 0; i < lines.length; i++) {
      if (inFence[i] || items[i].raw || isBlank(lines[i]) || isBoxLine(lines[i])) {
        flush();
        continue;
      }

      var m = match[i];
      if (m) {
        var gIndent = m[1].length;
        if (run.length && gIndent === runIndent && m[2] === runGlyph) {
          run.push(i);
        } else {
          flush();
          run = [i]; runIndent = gIndent; runGlyph = m[2];
        }
      } else if (!(run.length && indentOf(lines[i]) >= runIndent)) {
        flush();   // not a continuation — the run ends here
      }
    }
    flush();

    return items.map(function (item, i) {
      if (!action[i]) return item;
      var m = match[i];
      if (action[i] === 'bullet') {
        return { text: new Array(m[1].length + 1).join(' ') + '- ' + m[3], noJoin: false, raw: false };
      }
      // Chrome: the glyph and the indent that positioned it both go. The line is
      // flagged noJoin so it stays a line of its own — a stripped transcript
      // marker shouldn't get glued onto the text around it.
      return { text: m[3], noJoin: true, raw: false };
    });
  }

  /* Step 4 — collapse blank lines (runs to one; none at the very start or end). */

  function collapseBlanks(items) {
    var inFence = computeFences(items.map(text));
    var out = [];
    var lastBlank = false;

    for (var i = 0; i < items.length; i++) {
      if (inFence[i] || items[i].raw) {
        out.push(items[i]);
        lastBlank = false;
      } else if (isBlank(items[i].text)) {
        if (!lastBlank && out.length) out.push({ text: '', noJoin: false, raw: false });
        lastBlank = true;
      } else {
        out.push(items[i]);
        lastBlank = false;
      }
    }

    while (out.length && isBlank(out[0].text)) out.shift();
    while (out.length && isBlank(out[out.length - 1].text)) out.pop();
    return out;
  }

  /* Step 5 — join hard-wrapped lines within paragraphs. */

  function joinWraps(items) {
    var inFence = computeFences(items.map(text));
    var out = [];
    var buffer = null;
    var inIndentedCode = false;
    var afterBlank = true;   // start of text behaves like it follows a blank line

    function flush() {
      if (buffer !== null) { out.push(buffer); buffer = null; }
    }

    for (var i = 0; i < items.length; i++) {
      var line = items[i].text;

      if (items[i].raw || items[i].noJoin) {
        flush();
        out.push(line);
        inIndentedCode = false;
        afterBlank = false;
        continue;
      }

      if (inFence[i]) {
        flush();
        out.push(line);
        inIndentedCode = false;
        afterBlank = false;
        continue;
      }

      if (isBlank(line)) {
        flush();
        out.push('');
        inIndentedCode = false;
        afterBlank = true;
        continue;
      }

      var indent = indentOf(line);

      if (inIndentedCode) {
        if (indent >= 4) { out.push(line); afterBlank = false; continue; }
        inIndentedCode = false;
      }

      // An indented (unfenced) code block: 4+ spaces following a blank line.
      if (afterBlank && indent >= 4) {
        flush();
        out.push(line);
        inIndentedCode = true;
        afterBlank = false;
        continue;
      }

      if (BLOCK_START.test(line)) {
        flush();
        buffer = line;
      } else if (buffer === null) {
        buffer = line;
      } else {
        buffer += ' ' + line.trim();
      }
      afterBlank = false;
    }

    flush();
    return out;
  }

  /* Step 6 (Slack target only) — markdown to Slack mrkdwn.
   *
   * Slack is not markdown. It has no headings, no tables, no nested lists, and
   * it spells emphasis with single markers. This step is a translation of the
   * markers that survived, never a guess at emphasis that didn't — see the
   * scope note in specification.md.
   *
   * Fenced blocks pass through untouched: ``` means the same thing in both.
   */

  var MD_LINK = /!?\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
  var CODE_SPAN = /`[^`]*`/g;
  var HR = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
  var HEADING = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
  var BULLET = /^(\s*)[-*+][ \t]+/;
  var PIPE_ROW = /^\s*\|.*\|\s*$/;
  var PIPE_RULE = /^\s*\|[\s:|-]*-[\s:|-]*\|\s*$/;

  // Emphasis translation must not reach inside code spans or link URLs, so both
  // are lifted out to placeholders first and put back last. NUL is the marker;
  // any NUL already in the text is dropped up front so it cannot be confused.
  function slackInline(line) {
    var held = [];
    function hold(replacement) {
      held.push(replacement);
      return '\u0000' + (held.length - 1) + '\u0000';
    }

    line = line.replace(/\u0000/g, '');
    line = line.replace(CODE_SPAN, function (span) { return hold(span); });
    line = line.replace(MD_LINK, function (all, label, url) {
      return hold(label ? '<' + url + '|' + label + '>' : '<' + url + '>');
    });

    // Bold collapses to a single marker; a lone star becomes Slack italics.
    // Bold is held as NUL too, so the italic pass cannot see its stars.
    line = line.replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, function (all, inner) {
      return hold('*' + inner + '*');
    });
    line = line.replace(/__(\S(?:[\s\S]*?\S)?)__/g, function (all, inner) {
      return hold('*' + inner + '*');
    });
    line = line.replace(/~~(\S(?:[\s\S]*?\S)?)~~/g, '~$1~');
    line = line.replace(/\*(\S(?:[\s\S]*?\S)?)\*/g, '_$1_');

    return line.replace(/\u0000(\d+)\u0000/g, function (all, n) { return held[+n]; });
  }

  function slackify(text) {
    var lines = text.split('\n');
    var inFence = computeFences(lines);
    var out = [];

    // Dropping a thematic break can leave the blank lines that surrounded it
    // adjacent, so blanks are re-collapsed as they are emitted.
    function push(line) {
      if (isBlank(line) && (!out.length || isBlank(out[out.length - 1]))) return;
      out.push(line);
    }

    for (var i = 0; i < lines.length; i++) {
      if (inFence[i]) { out.push(lines[i]); continue; }

      // A pipe table renders as garbage in Slack. Fence the whole run so the
      // columns at least survive as monospace. Strict: a separator row required.
      if (PIPE_ROW.test(lines[i])) {
        var end = i, sep = false;
        while (end < lines.length && !inFence[end] && PIPE_ROW.test(lines[end])) {
          if (PIPE_RULE.test(lines[end])) sep = true;
          end++;
        }
        if (sep) {
          out.push('```');
          for (var t = i; t < end; t++) out.push(lines[t]);
          out.push('```');
          i = end - 1;
          continue;
        }
      }

      // A box that step 2.5 didn't recognise — a truncated paste, an unusual
      // border — never got fenced, and an unfenced grid in Slack is not
      // monospaced, so its columns don't line up and the grid is pointless.
      // Two or more consecutive box lines are unambiguously a box, so the run is
      // fenced here. Emphasis translation is skipped over it too: it would read
      // the */15 in a cron expression as italics.
      if (isBoxLine(lines[i])) {
        var boxEnd = i;
        while (boxEnd < lines.length && !inFence[boxEnd] && isBoxLine(lines[boxEnd])) boxEnd++;
        if (boxEnd - i >= 2) {
          out.push('```');
          for (var k = i; k < boxEnd; k++) out.push(lines[k]);
          out.push('```');
        } else {
          push(lines[i]);
        }
        i = boxEnd - 1;
        continue;
      }

      var line = lines[i];

      // Slack has no thematic break; a bare --- renders as literal dashes.
      if (HR.test(line) && !isBlank(line)) { continue; }

      var heading = HEADING.exec(line);
      if (heading) {
        push(heading[2] ? '*' + slackInline(heading[2]) + '*' : '');
        continue;
      }

      // Slack renders no nesting from pasted text; the indent is all we can keep.
      line = line.replace(BULLET, '$1• ');

      push(slackInline(line));
    }

    return out.join('\n');
  }

  function clean(source, target) {
    var lines = normalize(source);
    lines = dedent(lines);
    lines = stripTrailing(lines);

    // From here the steps carry per-line noJoin and raw flags alongside the text.
    var items = reconstructBlocks(lines, target);
    items = handleGlyphs(items);
    items = collapseBlanks(items);

    var text = joinWraps(items).join('\n');
    return target === 'slack' ? slackify(text) : text;
  }

  /* ------------------------------------------------------------------ *
   * UI wiring
   * ------------------------------------------------------------------ */

  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var cleanBtn = document.getElementById('clean');
  var slackBtn = document.getElementById('slackify');
  var copyBtn = document.getElementById('copy');
  var clearBtn = document.getElementById('clear');
  var outputTitle = document.getElementById('output-title');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function showToast(message, isError) {
    toast.textContent = message;
    toast.className = isError ? 'show error' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = ''; }, 1800);
  }

  function syncButtons() {
    var empty = input.value.trim() === '';
    cleanBtn.disabled = empty;
    slackBtn.disabled = empty;
    copyBtn.disabled = output.value === '';
  }

  function run(target, title, placeholder) {
    output.value = clean(input.value, target);
    output.scrollTop = 0;
    outputTitle.textContent = title;
    output.placeholder = placeholder;
    syncButtons();
  }

  input.addEventListener('input', syncButtons);

  cleanBtn.addEventListener('click', function () {
    run('markdown', 'Cleaned', 'Cleaned markdown appears here…');
  });

  slackBtn.addEventListener('click', function () {
    run('slack', 'Slack-ready', 'Slack-ready text appears here…');
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    output.value = '';
    outputTitle.textContent = 'Cleaned';
    output.placeholder = 'Cleaned markdown appears here…';
    syncButtons();
    input.focus();
  });

  copyBtn.addEventListener('click', function () {
    var text = output.value;

    function fallback() {
      // navigator.clipboard is unavailable on file:// in some browsers.
      output.focus();
      output.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      output.setSelectionRange(0, 0);
      output.blur();
      showToast(ok ? 'Copied to clipboard' : 'Copy failed', !ok);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('Copied to clipboard', false);
      }, fallback);
    } else {
      fallback();
    }
  });

  syncButtons();
})();
</script>

</body>
</html>
